name: release

# Cutting a release is `git tag v0.3.0 && git push origin v0.3.0`. Everything below is what
# happens next, and it is the only thing that ever publishes a release: no local build is ever
# uploaded by hand, so what people download is always traceable to a commit and a workflow run.
on:
  push:
    tags: ['v*']

  # Lets a failed publish be re-run without moving the tag, which is the one thing you must
  # never do once anybody has downloaded it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.3.0'
        required: true

permissions:
  contents: write        # create the release and upload assets
  id-token: write        # provenance attestation
  attestations: write

jobs:
  release:
    runs-on: windows-latest

    # Job level, not step level. A step's `if:` is evaluated before the step's own `env:` block
    # exists, so `env.NOSTOS_SIGNING_KEY` inside a step that defines it is always empty and the
    # signing step would silently never run.
    env:
      NOSTOS_SIGNING_KEY: ${{ secrets.NOSTOS_SIGNING_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Release notes are generated from the log since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $tag = '${{ inputs.tag }}'
          if (-not $tag) { $tag = '${{ github.ref_name }}' }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not vMAJOR.MINOR.PATCH. The updater refuses anything else, so a release named this way would be invisible to it."
          }
          "tag=$tag"                 >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      # The same gate as every pull request. A tag is not a reason to skip it -- it is the one
      # build that reaches people who did not choose to be testing it.
      - name: Test
        run: dotnet test Nostos.slnx --configuration Release

      - name: Publish the portable single file
        shell: pwsh
        run: ./scripts/publish.ps1 -SingleFile -Output artifacts/portable -Version ${{ steps.version.outputs.version }}

      - name: Publish the folder build
        shell: pwsh
        run: >
          ./scripts/publish.ps1
          -Output artifacts/Nostos-${{ steps.version.outputs.version }}-win-x64
          -Zip -Version ${{ steps.version.outputs.version }}

      - name: Collect the assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item artifacts/portable/Nostos.exe out/
          Copy-Item artifacts/Nostos-${{ steps.version.outputs.version }}-win-x64.zip out/
          Get-ChildItem out | Select-Object Name, Length

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          # sha256sum's format, because that is what people already know how to check and what
          # ReleaseIntegrity.ExpectedHash parses. Sorted so the file is stable between runs.
          $lines = Get-ChildItem out -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          }
          # No trailing newline and LF only: the signature covers these exact bytes.
          [System.IO.File]::WriteAllText("$PWD/out/SHA256SUMS.txt", ($lines -join "`n"), [System.Text.UTF8Encoding]::new($false))
          Get-Content out/SHA256SUMS.txt

      - name: Sign the checksums
        if: ${{ env.NOSTOS_SIGNING_KEY != '' }}
        run: >
          dotnet run --project tools/Nostos.ReleaseTool --
          sign --checksums out/SHA256SUMS.txt --key-env NOSTOS_SIGNING_KEY

      - name: Refuse to publish an unsigned release
        if: ${{ env.NOSTOS_SIGNING_KEY == '' }}
        shell: pwsh
        run: |
          # Failing here is deliberate. Every installed copy refuses an update whose checksums
          # are not signed, so an unsigned release is not a slightly-worse release -- it is one
          # that silently reaches nobody, and looks like a broken updater when people report it.
          throw @'
          The NOSTOS_SIGNING_KEY secret is not set, so this release cannot be signed.

            dotnet run --project tools/Nostos.ReleaseTool -- keygen --out key.pem
            gh secret set NOSTOS_SIGNING_KEY --body (Get-Content key.pem -Raw)

          Then paste the printed public key into src/Nostos.Core/Updates/ReleaseIntegrity.cs,
          commit it, and re-tag. See docs/releasing.md.
          '@

      # Free, and stronger evidence than a certificate for this audience: it ties each file to
      # the exact commit and workflow run that produced it, verifiable with
      #   gh attestation verify Nostos.exe --repo rA9-001/Nostos
      - name: Attest the build
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'out/Nostos.exe, out/*.zip'

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          # Empty on the first release, which is not an error. `git describe` exits non-zero
          # there, and a native non-zero does not stop a pwsh step, but saying so beats relying
          # on it.
          $previous = $(git describe --tags --abbrev=0 "$tag^" 2>$null)
          if ($LASTEXITCODE -ne 0) { $previous = $null }

          $notes = @()
          $notes += "Run ``Nostos.exe``. That is the whole setup."
          $notes += ""
          $notes += "| file | what it is |"
          $notes += "| --- | --- |"
          $notes += "| ``Nostos.exe`` | The whole application in one file. Nothing to install. |"
          $notes += "| ``Nostos-${{ steps.version.outputs.version }}-win-x64.zip`` | Full folder including the background service. |"
          $notes += ""
          $notes += "Already running Nostos? It will offer this to you on next launch, or run ``nos update --install``."
          $notes += ""
          $notes += "Verify what you downloaded:"
          $notes += ""
          $notes += '```'
          $notes += "gh attestation verify Nostos.exe --repo ${{ github.repository }}"
          $notes += '```'
          $notes += ""
          if ($previous) {
            $notes += "## Changes since $previous"
            $notes += ""
            $notes += (git log --no-merges --pretty=format:'- %s' "$previous..$tag")
          }
          $notes -join "`n" | Set-Content release-notes.md -Encoding utf8

          $assets = Get-ChildItem out -File | ForEach-Object { $_.FullName }
          gh release create $tag --title "Nostos $tag" --notes-file release-notes.md @assets
